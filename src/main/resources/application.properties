spring.application.name=FinFlow Backend

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
app.security.google.client-id=${GOOGLE_CLIENT_ID}

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=bao19042004@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=true

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=60000

# DEBUG ONLY: show actual JDBC bind parameter values in logs (needed to verify valuations startDate/endDate -> quarterMin/quarterMax).
# Before production, comment/remove these TRACE lines to avoid performance impact + log explosion.
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

jwt.signerKey=${FINFLOW_JWTSIGNERKEY}
internal.api.key=${INTERNAL_API_KEY:}
data.ai.base-url=${DATA_AI_SERVICE_URL:http://localhost:8001}
data.ai.internal-api-key=${INTERNAL_API_KEY:}

# Analytics AI: two-tier insights (FULL vs SPARSE) + lookback for counting
finflow.analytics-insights.min-transactions-for-full=${FINFLOW_ANALYTICS_MIN_TX_FOR_FULL:5}
finflow.analytics-insights.lookback-days=${FINFLOW_ANALYTICS_LOOKBACK_DAYS:90}

# Flyway migration for production-ready chat schema
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=0
